name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Librerías del sistema para el PDF (Pango, poppler y fuentes con cirílico)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 poppler-utils fonts-dejavu-core fonts-noto-core

      - name: Instalar Python 3.12 y dependencias
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Pruebas (sin integracion ni vivo)
        run: uv run pytest -q
