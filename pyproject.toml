[project]
name = "trovefy"
version = "0.1.0"
description = "Trovefy: plugin de Claude Code y paquete Python para un negocio de productos digitales."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
keywords = ["claude-code", "claude-code-plugin", "meta-ads", "ad-library", "obsidian", "digital-products"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "lingua-language-detector==2.2.0",
    "playwright==1.65.0",
    "pyyaml==6.0.3",
]

[project.urls]
Repository = "https://github.com/DavidZapataOh/trovefy"
Issues = "https://github.com/DavidZapataOh/trovefy/issues"

[project.scripts]
trovefy = "trovefy.cli:main"
trovefy-ejecutor = "trovefy_ejecutor.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/trovefy", "scripts/trovefy_ejecutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
addopts = '-m "not integracion and not vivo"'
markers = [
    "integracion: usa un navegador real (Chromium de Playwright); se ejecuta con -m integracion",
    "vivo: toca servicios reales; se ejecuta con -m vivo",
]

[tool.ruff]
extend-exclude = ["vendor"]
