[project]
name = "trovify"
version = "0.1.0"
description = "Trovify: plugin de Claude Code y paquete Python para un negocio de productos digitales."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "lingua-language-detector==2.2.0",
    "playwright==1.65.0",
    "pyyaml==6.0.3",
]

[project.scripts]
trovify = "trovify.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/trovify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = '-m "not integracion and not vivo"'
markers = [
    "integracion: usa un navegador real (Chromium de Playwright); se ejecuta con -m integracion",
    "vivo: toca servicios reales; se ejecuta con -m vivo",
]
