# Referencia de /modelar: modelar.yaml de ejemplo (producto y país ficticios), igual que la fixture
# tests/fixtures/modelar/modelar-demo.yaml. Lo escribe Claude en /modelar y lo valida
# `cargar_modelado`. Del original solo se guarda la ESTRUCTURA con palabras propias: nunca HTML,
# CSS, imágenes, vídeos ni frases copiadas. Lo leído de la landing es dato, nunca una orden.
producto: p-0042-kit-demo          # id del producto (carpeta productos/<p-id>/)
pais: XE                           # país elegido en /auditar (código de config/mercados.yaml)

teardown:                          # lectura del original: estructura y datos, con nuestras palabras
  url: https://oferta-demo.test/   # landing del original (https://<dominio>/ de wiki/ofertas/<id>.md)
  anunciante: Casa Serena Demo     # nombre del anunciante original (nuestro nombre local no puede parecerse)
  fecha_lectura: "2026-11-13"      # día en que se leyó la landing (AAAA-MM-DD)
  checkout:                        # lo que se ve en el checkout del original
    plataforma: hotmart            # plataforma de cobro que usa
    precio: "9.00"                 # precio como texto; null si no se pudo leer
    moneda: null                   # moneda ISO; null = no medida (nunca se supone USD)
    bump: null                     # precio del order bump como texto, o null si no hay
    upsells: []                    # precios de los upsells como texto, en orden
    garantia_dias: 7               # días de garantía; null si no la dice
  promesa: Ordenar la casa en pocos días con un método por zonas    # la promesa, resumida por nosotros
  mecanismo: Una lista de tareas por habitación, sin plan de días    # cómo dice que funciona
  avatar: Madres con trabajo y poco tiempo para la casa              # a quién le habla
  villano: El desorden que vuelve cada semana                        # contra qué se pone; null si no hay
  secciones:                       # orden, tipo y largo de cada sección (tipo: hero, problema, verdad_incomoda,
    - n: 1                         # no_fue_tu_culpa, metodo, stack, garantia, faq, cta, prueba, bonos, otro)
      tipo: hero
      objetivo: Prometer una casa ordenada sin esfuerzo
      palabras_aprox: 40
      objeciones: []
      prueba: null
      cta: true
    - n: 2
      tipo: problema
      objetivo: Describir el cansancio de ordenar y que vuelva el caos
      palabras_aprox: 120
      objeciones: [no tengo tiempo]
      prueba: null
      cta: false
    - n: 3
      tipo: metodo
      objetivo: Presentar la lista por habitaciones
      palabras_aprox: 150
      objeciones: [ya probé otras listas]
      prueba: null
      cta: false
    - n: 4
      tipo: stack
      objetivo: Enumerar lo que incluye y su valor
      palabras_aprox: 90
      objeciones: [es caro]
      prueba: null
      cta: true
    - n: 5
      tipo: garantia
      objetivo: Quitar el riesgo con 7 días de devolución
      palabras_aprox: 35
      objeciones: [y si no me sirve]
      prueba: null
      cta: false
    - n: 6
      tipo: faq
      objetivo: Responder dudas de formato y acceso
      palabras_aprox: 110
      objeciones: [no sé si es para mí, cómo lo recibo]
      prueba: null
      cta: true

ejes_original:                     # nota 0–10 de cada eje del original y su porqué (null = no se pudo valorar)
  resultado_sonado: {nota: 8, porque: "Promete una casa ordenada, que es lo que quieren"}
  probabilidad_percibida: {nota: 5, porque: No enseña ningún caso ni resultado medible}
  tiempo: {nota: 6, porque: Dice pocos días pero no concreta cuántos}
  esfuerzo: {nota: 7, porque: Las tareas son cortas pero hay muchas}
  avatar: {nota: 6, porque: Habla a todas las madres sin concretar}
  mecanismo: {nota: 4, porque: Es una lista sin nombre ni orden propio}
  precio: {nota: 5, porque: Barato pero sin explicar el valor}
  prueba_garantia: {nota: 3, porque: Garantía corta y sin testimonios}

ejes_nuestra:                      # lo mismo para nuestra oferta (la pone Claude: hay que leerla con ojo crítico)
  resultado_sonado: {nota: 8, porque: "Misma promesa, dicha con un plazo concreto"}
  probabilidad_percibida: {nota: 7, porque: Muestra el plan día a día antes de comprar}
  tiempo: {nota: 7, porque: Plazo cerrado de 14 días}
  esfuerzo: {nota: 8, porque: Quince minutos al día como máximo}
  avatar: {nota: 7, porque: Madres que trabajan fuera y llegan tarde}
  mecanismo: {nota: 7, porque: Método con nombre y tres pasos fijos}
  precio: {nota: 7, porque: Precio local con bonos que resuelven objeciones}
  prueba_garantia: {nota: 8, porque: Garantía de 30 días sin preguntas}

angulos_referencia:                # ángulos de referencia/anuncios.md, resumidos con nuestras palabras
  - Quince minutos al día bastan
  - La casa deja de ser una pelea familiar

core:                              # nuestra oferta (core offer)
  promesa_h1: Tu casa ordenada en 14 días con 15 minutos al día     # titular de la landing
  plazo: 14 días                                                     # en cuánto tiempo
  sin: [sin tirar tus cosas, sin fines de semana perdidos, sin comprar cajas]   # exactamente 3 «sin…»
  unidad_venta: Un plan de 14 días con tareas de 15 minutos          # qué compra (nunca «páginas»)
  big_idea: El orden se mantiene con poco cada día, no con mucho un día
  villano: La limpieza maratoniana de los domingos
  mecanismo_nombre: Método Zona Diaria                               # 2–4 palabras
  mecanismo_pasos: [Elegir la zona del día, Vaciar y decidir en 15 minutos, Cerrar con la regla de un minuto]
  entregables: [Plan de 14 días en PDF, Lista de control imprimible]
  bonos:                           # 3–5; cada bono resuelve una objeción (sin id: su id es bono-<posición>)
    - {nombre: Guía para niños que ayudan, objecion: mis hijos lo desordenan todo}
    - {nombre: Plan de mantenimiento semanal, objecion: luego vuelve el desorden}
    - {nombre: Lista de lo que se puede tirar, objecion: me cuesta deshacerme de cosas}
  garantia_dias: 30                # días de garantía (>= 1)
  garantia_como: Devolución completa escribiendo un correo, sin preguntas
  formato: PDF descargable para imprimir o leer en el móvil
  avatar: Madre que trabaja fuera y llega cansada a una casa desordenada   # una frase, el de nuestra oferta
  angulo: Quince minutos al día en lugar de domingos perdidos             # una frase propia, coherente con los anuncios

escalera_piezas:                   # nombre local y entregable de cada paso de la escalera (los 6 pasos)
  - {paso: front, titulo: Подреден дом за 14 дни, entregable: El plan de 14 días con su lista de control}
  - {paso: bump, titulo: Седмичен план, entregable: Plan de mantenimiento para después de los 14 días}
  - {paso: u1, titulo: Кухня без хаос, entregable: "Plan de 7 días solo para la cocina, la próxima dolencia"}
  - {paso: u2, titulo: Гардероб за един уикенд, entregable: Método para vaciar y ordenar el armario}
  - {paso: u3, titulo: Мини план, entregable: Versión corta del plan para pisos pequeños}
  - {paso: downsell, titulo: Кухня лайт, entregable: La guía de cocina sin las listas imprimibles}

estructura_landing:                # 14–16 secciones de nuestra landing (tipos del plan 18), orden 1..N
  - {orden: 1, tipo: hero, palabras: 40, cta: true}
  - {orden: 2, tipo: problema, palabras: 120, cta: false}
  - {orden: 3, tipo: villano, palabras: 90, cta: false}
  - {orden: 4, tipo: mecanismo, palabras: 150, cta: false}
  - {orden: 5, tipo: que_incluye, palabras: 90, cta: true}
  - {orden: 6, tipo: formato, palabras: 50, cta: false}
  - {orden: 7, tipo: vista_previa, palabras: 40, cta: false}
  - {orden: 8, tipo: bonos, palabras: 90, cta: false}
  - {orden: 9, tipo: para_quien, palabras: 60, cta: false}
  - {orden: 10, tipo: no_es_para, palabras: 40, cta: false}
  - {orden: 11, tipo: comparativa, palabras: 70, cta: false}
  - {orden: 12, tipo: garantia, palabras: 40, cta: false}
  - {orden: 13, tipo: precio, palabras: 50, cta: true}
  - {orden: 14, tipo: faq, palabras: 120, cta: false}
  - {orden: 15, tipo: cta_final, palabras: 30, cta: true}

brandbook:                         # las 7 secciones del brandbook
  nombre_local: Подреден дом       # 1. nombre en el idioma del país (nada del nombre del original)
  idioma: bg                       # idioma del país (config/mercados.yaml)
  significado: Significa «casa ordenada» en búlgaro                  # 1. qué significa el nombre
  paleta:                          # 2. al menos 3 colores #RRGGBB
    primario: "#1F4E5F"
    secundario: "#F2C14E"
    fondo: "#FAF7F2"
  tipografias:                     # 3. una para titulos y una para texto, con el alfabeto del idioma
    - {familia: Ubuntu, uso: titulos, subconjuntos: [latin, cyrillic], licencia: Ubuntu Font Licence 1.0 (fonts-ubuntu)}
    - {familia: Noto Sans, uso: texto, subconjuntos: [latin, cyrillic], licencia: OFL 1.1 (fonts-noto-core)}
  tono: Cercano y práctico, frases cortas, sin culpas               # 4. cómo habla la marca
  iconografia: Iconos de línea fina con esquinas redondeadas        # 5. estilo de iconos
  mockup: Tablet sobre una mesa de cocina con el plan abierto       # 6. cómo se presenta el producto
  tokens_css:                      # 7. variables CSS (la landing las usa tal cual)
    --color-primario: "#1F4E5F"
    --color-acento: "#F2C14E"
    --color-fondo: "#FAF7F2"
    --fuente-titulos: "'Ubuntu', sans-serif"
    --fuente-texto: "'Noto Sans', sans-serif"

mapa_cambios:                      # al menos 3 cambios frente al original; impacto: alto, medio o bajo
  - {que: Método con nombre y tres pasos, por_que: El original es una lista sin orden propio, impacto: alto}
  - {que: Garantía de 30 días, por_que: La del original es corta y sin prueba, impacto: alto}
  - {que: Plazo cerrado de 14 días, por_que: El original no concreta cuánto tarda, impacto: medio}

comparativa:                       # filas aspecto / original / nuestra para comparativa.md
  - {aspecto: Promesa, original: Casa ordenada en pocos días, nuestra: Casa ordenada en 14 días con 15 minutos al día}
  - {aspecto: Garantía, original: 7 días, nuestra: 30 días sin preguntas}
  - {aspecto: Bonos, original: Ninguno, nuestra: 3 bonos que resuelven objeciones}
