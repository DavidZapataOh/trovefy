# Preferencias de /cazar. La skill rellena «nichos» y «palabras» con el usuario en la primera caza
# y guarda aquí las palabras que rinden (las que no, se reescriben).
perfil: tomi

# Regiones R9: EE. UU. + GB, Brasil, LatAm en español y Europa (los mercados de config/mercados.yaml).
regiones:
  eeuu_gb: [US, GB]
  br: [BR]
  latam_es: [MX, CO, AR, CL, PE, EC, GT, DO, UY, CR, PA, BO, PY]
  europa: [RO, MD, CZ, HU, BG, IT, FR, ES, PT, PL, GR, SE, NO, DK, FI]

# Nichos elegidos por el usuario (por ejemplo «fichas de terapia», «recursos para docentes»).
nichos: []

# Frases de 2–3 palabras por idioma (código ISO 639-1), por ejemplo:
#   ro: [fise de lucru, fise pentru copii]
palabras: {}

# Cuotas de la rutina diaria (decisión del controlador, ronda 1 de la Tarea 8, I3): el tope de
# búsquedas del día (caza.max_busquedas_sesion en umbrales.yaml) lo comparten tu sesión y la rutina;
# la rutina nunca usa más de «max_busquedas» y el resto del día queda para ti. «vigilar» mide como
# mucho «max_vigiladas_por_dia» fichas al día, empezando por las que hace más tiempo que no se miden.
rutina:
  max_busquedas: 20
  max_vigiladas_por_dia: 6
