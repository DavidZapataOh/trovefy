    kit: {valor: 10, fuente: "diseñador (plan 17), a recalibrar con el primer producto", fecha: "2026-11-16"}
    bono: {valor: 4, fuente: "diseñador (plan 17), a recalibrar con el primer producto", fecha: "2026-11-16"}
    bump: {valor: 4, fuente: "diseñador (plan 17, resolución 13): pieza pequeña como un bono, a recalibrar con el primer producto", fecha: "2026-11-16"}
    upsell: {valor: 8, fuente: "diseñador (plan 17), a recalibrar con el primer producto; vale para u1, u2, u3 y downsell", fecha: "2026-11-16"}
