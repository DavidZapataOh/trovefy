# Producto (/producto): tope de APIMart, modelos de imagen, contador del plan y umbral de los gates.
# Cada hoja lleva {valor, fuente, fecha}, como config/economia.yaml. El tope de un producto concreto
# puede subirse en su PRODUCTO.md (apimart_tope_usd), siempre con la cita literal del usuario.
apimart:
  tope_producto_usd: {valor: "2.00", fuente: "§4.7: portada, mockup y 6–10 ilustraciones; suma principal, bonos y upsells (contrato 7)", fecha: "2026-11-16"}
