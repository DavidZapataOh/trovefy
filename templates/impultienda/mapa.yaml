# Mapa de pantallas de Impultienda (paso 09 y fase 2). Las pantallas sin «controles» son solo de lectura; las que
# tienen controles solo las toca `trovefy.tienda.conductor.Conductor`, y solo con su «capturado» confirmado.
# capturado: null = construido desde la página pública, NO confirmado con tu pantalla real.
# Mientras sea null, el verificador del paso 09 devuelve «no medido» y guarda la captura como provisional.
# Se confirma de dos maneras equivalentes: el usuario, con `trovefy arranque confirmar 09` sobre el texto provisional de
# su pantalla real (queda en config/confirmaciones.yaml del vault), o un commit que ajusta firmas y patrones y pone aquí la fecha.
#
# OJO (plan 18b, prueba real del 2026-11-17): las URLs app.impultienda.ar/dashboard/* de abajo están SIN VERIFICAR.
# https://app.impultienda.ar/ responde «No hay ninguna tienda acá», y el inicio de sesión real está en
# https://impultienda.ar/login. Por eso la landing se publica con pegado manual (`trovefy landing publicar --manual`):
# trovefy no inicia sesión en el panel. No cambies aquí url/firma/campos/controles sin verificarlos en la pantalla
# real: entran en la huella de la pantalla y anularían las confirmaciones del usuario.
capturado: null
fuente: >-
  https://impultienda.ar/ (página pública, leída el 2026-11-10): planes Free/Starter/Pro/Max/Unlimited,
  «Tiendas activas» y «Ranking de tiendas» del panel de muestra, menú Inicio/Configuraciones, pasarelas
  MercadoPago, Stripe, PayPal y Whop. Las rutas /dashboard/plan y /dashboard/configuraciones son una
  suposición a partir del menú de la maqueta (solo /dashboard/inicio aparece en la página pública).
# Límites por plan (plan 19, Tarea 10): fuera de las pantallas, no entran en la huella del paso 09. null = no
# publicado en la página pública: se lee con impultienda_ver_plan (límites efectivos con addons) antes de la receta.
limites_plan:
  Free: {tiendas: 1, bumps: null, upsells: 1, downsell: null}
  Starter: {tiendas: 2, bumps: null, upsells: 1, downsell: null}
  Pro: {tiendas: 3, bumps: null, upsells: 2, downsell: null}
  Max: {tiendas: 10, bumps: null, upsells: 3, downsell: null}
fuente_limites: >-
  https://impultienda.ar/ (página pública de planes, leída el 2026-11-17): «Cantidad de tiendas» y upsells
  post-compra por plan. Order bumps y downsell no se publican (null); Unlimited (ilimitados) no se usa. Los límites
  efectivos de la cuenta (base + addons) se leen con impultienda_ver_plan.
pantallas:
  plan:
    url: https://app.impultienda.ar/dashboard/plan
    firma: ["Plan actual"]
    campos:
      plan: {patron: 'Plan actual:\s*(\w+)'}
      estado: {patron: 'Estado del plan:\s*(\w+)'}
  tiendas:
    url: https://app.impultienda.ar/dashboard/inicio
    firma: ["Tiendas activas"]
    campos:
      tiendas: {patron: '(\d+)\s+Tiendas activas'}
  pasarelas:
    url: https://app.impultienda.ar/dashboard/configuraciones
    firma: ["Pasarelas de pago"]
    prohibida: true  # pantalla de pagos: se lee, nunca se escribe ni se captura
    campos:
      pasarelas: {patron: 'Pasarelas conectadas:\s*([^<\n]+)'}
  # Plan 18 (/landing): «Diseño de tienda › Contenido», campo «HTML completo de la tienda» (captura del usuario,
  # config/evidencia/09-captura-usuario-2026-11-12.png). La ruta es una suposición: la URL real la guarda la
  # confirmación del usuario. capturado: null hasta que un commit lo fije; mientras tanto vale la confirmación de
  # `trovefy landing capturar` (fuera del vault, 90 días, atada a la captura config/evidencia/p05-diseno-contenido-
  # <fecha>.png); sin ella, el conductor lee pero no escribe. Resolución 20 del contrato de la fase 2.
  diseno_contenido:
    url: https://app.impultienda.ar/dashboard/diseno/contenido
    firma: ["Diseño de tienda", "HTML completo de la tienda", "Guardar cambios"]
    capturado: null
    controles:
      html: {css: "textarea", tipo: area}
      guardar: {etiqueta: "Guardar cambios", rol: button, tipo: boton}
