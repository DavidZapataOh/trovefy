# Léxico semilla de promesas prohibidas en búlgaro (QG-10 ingresos, QG-11 salud). Propio del plan 17.
# Lo revisa el agente `nativo` en el primer uso real; las ampliaciones van al vault
# (config/promesas/bg.yaml, mismas claves) y se suman a estas; nunca se cambian en el código.
# «гаранция» (la garantía de reembolso) NO es una promesa. Una coincidencia negada («не лекува») es un descargo.
ingresos:
  - '\bпасивен доход'
  # Segunda persona dirigida al lector con una cantidad («ще печелиш 500 лева», «ще спечелите 2000 евро») y el
  # imperativo «спечелете»; «кой печели…» (tercera persona) no es una promesa.
  - '\b(с)?печел(иш|ите|ете) (по )?(\d+|хиляд\w*|милион\w*)'
  - '\bспечелете\b'
salud:
  # «лекува» pero no «лекуващ-» (el médico que lleva el caso: «лекуващия лекар»).
  - '\bлекува(?!щ)'
  - '\bизлекува(не)?'
  - '\bвместо лекар'
  - '\bбез лекарства'
  - '\bгарантиран(о|и)? резултат'
