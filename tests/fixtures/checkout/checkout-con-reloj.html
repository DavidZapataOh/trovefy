<!DOCTYPE html>
<!-- El checkout ficticio con lo que prohíbe D-01: cuenta atrás y «N personas comprando» visibles. -->
<html lang="bg"><head><meta charset="utf-8"><title>Checkout - Somatix</title></head>
<body>
<header><span>Сигурно плащане</span>
  <div class="countdown">Офертата изтича след <b>06:59</b></div>
  <div class="live-buyers"><strong>5 души</strong> купуват в момента</div>
</header>
<section id="resumen">
  <img src="https://prueba.impultienda.example/recursos/mockup.webp" alt="Спокойно тяло">
  <h2>Спокойно тяло</h2>
  <p class="precio">13,90 €</p>
  <p>Получаваш ръководството веднага след плащането, на имейла си. Без абонамент и без скрити такси.</p>
</section>
<section id="datos">
  <label>Имейл *</label>
  <input type="email" id="checkout-email" name="email" autocomplete="email">
  <label>Име *</label>
  <input type="text" id="checkout-first-name" name="given-name" autocomplete="given-name">
  <label>Телефон *</label>
  <input type="tel" id="checkout-phone" name="phone" autocomplete="tel">
</section>
<button type="button" id="pay-btn">Плати 13,90 €</button>
<input type="hidden" id="store-name" value="Somatix">
<input type="hidden" id="store-language" value="bg">
<input type="hidden" id="ebook-main-price" value="13.9">
<input type="hidden" id="ebook-currency" value="EUR">
<input type="hidden" id="buyer-country" value="ZZ">
<input type="hidden" id="pay-button-color" value="#16a34a">
</body></html>
