<!DOCTYPE html>
<!-- Checkout ficticio sin pintar, para Chromium real (tests/integracion): oculta campos con CSS y JavaScript,
     manda una «visita» por POST al cargar y, si alguien pulsara «Плати», pediría «preparar pago». La red del
     comprador tiene que abortar las dos cosas. Datos inventados. -->
<html lang="bg"><head><meta charset="utf-8"><title>Checkout - Somatix</title>
<style>#field-last-name{display:none}</style></head>
<body>
<header><span>Сигурно плащане</span></header>
<section id="resumen">
  <img src="/foto.png" alt="Спокойно тяло">
  <h2>Спокойно тяло</h2>
  <p class="precio">13,90 €</p>
  <p>Получаваш ръководството веднага след плащането, на имейла си. Без абонамент и без скрити такси.</p>
</section>
<section id="datos">
  <label>Имейл *</label>
  <input type="email" id="checkout-email" name="email" autocomplete="email">
  <label>Име *</label>
  <input type="text" id="checkout-first-name" name="given-name" autocomplete="given-name">
  <div id="field-last-name"><input type="text" id="checkout-last-name" name="family-name" autocomplete="family-name"></div>
  <div id="direccion"><input type="text" id="checkout-address" name="address-line1" autocomplete="address-line1"></div>
  <label>Телефон *</label>
  <input type="tel" id="checkout-phone" name="phone" autocomplete="tel">
</section>
<div id="order-bumps-mobile"></div>
<button type="button" id="pay-btn">Плати 13,90 €</button>
<input type="hidden" id="store-name" value="Somatix">
<input type="hidden" id="store-language" value="bg">
<input type="hidden" id="ebook-title" value="Спокойно тяло">
<input type="hidden" id="ebook-main-price" value="13.9">
<input type="hidden" id="ebook-currency" value="EUR">
<input type="hidden" id="buyer-country" value="ZZ">
<input type="hidden" id="pay-button-color" value="#16a34a">
<input type="hidden" id="i18n-widget-stock" value="Остават само {count} места">
<script>
  document.getElementById('direccion').style.display = 'none';
  fetch('/rest/v1/visits', {method: 'POST', body: '{}'}).catch(function () {});
  document.getElementById('pay-btn').addEventListener('click', function () {
    fetch('/functions/v1/impulpay-prepare', {method: 'POST', body: '{}'}).catch(function () {});
  });
</script>
</body></html>
